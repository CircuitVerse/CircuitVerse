default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5) } %>
  checkout_timeout: <%= ENV.fetch("DB_CHECKOUT_TIMEOUT", 5.0) %>
  reaping_frequency: <%= ENV.fetch("DB_REAPING_FREQUENCY", 10) %>
  variables:
    statement_timeout: <%= ENV.fetch("DB_STATEMENT_TIMEOUT", "5000") %>
    lock_timeout: <%= ENV.fetch("DB_LOCK_TIMEOUT", "3000") %>
    idle_in_transaction_session_timeout: <%= ENV.fetch("DB_IDLE_TX_TIMEOUT", "10000") %>
  username: postgres
  password: postgres
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>

development:
  <<: *default
  database: circuitverse_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: circuitverse_test
  pool: <%= ENV.fetch("TEST_DB_POOL", 5) %>

production:
  <<: *default
  url: <%= ENV["POSTGRES_URL"] %>
  database: circuitverse_production
  sslmode: <%= ENV.fetch("DB_SSL_MODE", "prefer") %>
