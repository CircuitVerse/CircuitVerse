name: Codespaces Test

on:
  pull_request:
    paths:
      - ".devcontainer/*"

jobs:
  test-config:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set Dev Container build arguments
        run: |
          {
            echo "CURRENT_UID=$(id -u)"
            echo "CURRENT_GID=$(id -g)"
            echo "NON_ROOT_USERNAME=user"
            echo "NON_ROOT_GROUPNAME=user"
            echo "OPERATING_SYSTEM=linux"
          } >> "$GITHUB_ENV"

      - name: Lint Shell Scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck .devcontainer/boot.sh
          shellcheck .devcontainer/setup.sh
          shellcheck .devcontainer/initialize.sh
          shellcheck bin/docker/setup

      - name: Validate devcontainer.json
        run: jq . < .devcontainer/devcontainer.json

      - name: Validate Dev Container compose config
        run: docker compose -f docker-compose.yml -f .devcontainer/docker-compose.extend.yml config

      - name: Build and boot the Dev Container
        run: |
          docker compose -f docker-compose.yml -f .devcontainer/docker-compose.extend.yml up -d --build web
          docker compose -f docker-compose.yml -f .devcontainer/docker-compose.extend.yml exec -T web .devcontainer/setup.sh
          docker compose -f docker-compose.yml -f .devcontainer/docker-compose.extend.yml exec -d web .devcontainer/boot.sh

      - name: Smoke test the web service on port 3000
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "Web service responded with HTTP $code"
              exit 0
            fi
            sleep 6
          done
          echo "Web service did not respond on port 3000"
          docker compose -f docker-compose.yml -f .devcontainer/docker-compose.extend.yml exec -T web sh -c "tail -n 100 log/development.log 2>/dev/null || echo 'no log/development.log found'"
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f .devcontainer/docker-compose.extend.yml down
