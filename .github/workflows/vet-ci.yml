name: vet

on:
  pull_request:
  # A push run scans the whole checkout. It finds a change that reaches master
  # with no pull request, such as a push from a compromised account.
  push:
    branches: [master]
  # A weekly run finds malware that SafeDep Threat Intel reports after a merge.
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: vet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: safedep/vet@f9e8e249dfbe17327897b2e8d88faea372618163 # v2.0.0-alpha.20261124143912
        with:
          policy: .github/vet/policy.yml
          package-cooldown: "3"
